<navbar-component></navbar-component>

<div class="pt-20 pl-64 min-h-screen bg-[#F3F7FC] dark:bg-gray-900 transition-colors duration-200">
  <main class="p-8">
    <div class="flex justify-between">
      <div>
        <h1 class="text-3xl text-[#10345B] dark:text-white font-bold">Rooms</h1>
        <p class="text-xl text-[#10345B] dark:text-gray-300 mt-2">
          Manage your campus simply and efficiently
        </p>
      </div>

      <button-component title="+ Réserver"></button-component>
    </div>

    <searchFilter-component></searchFilter-component>

    <div id="containerTables" class="grid mr-20">
      <p class="text-red-500">Nombre de salles : {{ roomsData().length }}</p>
      <table-component [headers]="roomHeaders" [datas]="roomsData()" />
    </div>
  </main>
</div>
