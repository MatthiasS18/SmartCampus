<navbar-component></navbar-component>
<sidebar-component></sidebar-component>

<div class="pt-20 pl-64 min-h-screen bg-[#F3F7FC] dark:bg-gray-900 transition-colors duration-200">
  <main class="p-8 flex flex-col gap-5">
    <div class="flex justify-between">
      <div>
        <h1 class="text-3xl text-[#10345B] dark:text-white font-bold">Rooms</h1>
        <p class="text-xl text-[#10345B] dark:text-gray-300 mt-2">
          Manage your campus simply and efficiently
        </p>
      </div>

      <button-component title="+ Nouvelle réservation"></button-component>
    </div>

    <div
      id="reservation"
      class="p-3 border border-gray-200 dark:border-gray-700 rounded-lg flex gap-10 bg-white dark:bg-gray-800"
    >
      <a
        href=""
        class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300"
      >
        Mes réservations
      </a>

      <div class="text-gray-400 dark:text-gray-500">|</div>

      <a
        href=""
        class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300"
      >
        Toutes les réservations
      </a>
    </div>

    <div id="table" class="">
      <table-component
        title="Consultez et gérez les réservations de salles."
        [headers]="reservationHeaders"
      ></table-component>
    </div>
  </main>
</div>
