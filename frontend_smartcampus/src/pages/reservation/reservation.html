<navbar-component></navbar-component>
<sidebar-component></sidebar-component>

<div class="pt-20 pl-64 min-h-screen bg-[#F3F7FC] dark:bg-gray-900 transition-colors duration-200">
  <main class="p-8 flex flex-col gap-5">
    <div class="flex justify-between">
      <div>
        <h1 class="text-3xl text-[#10345B] dark:text-white font-bold">Reservations</h1>
        <p class="text-xl text-[#10345B] dark:text-gray-300 mt-2">
          Manage your campus simply and efficiently
        </p>
      </div>

      <button-component title="+ Nouvelle réservation"></button-component>
    </div>

    <div
      id="reservation"
      class="p-3 border border-gray-200 dark:border-gray-700 rounded-lg flex gap-10 bg-white dark:bg-gray-800"
    >
      <a
        href=""
        class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300"
      >
        Mes réservations
      </a>

      <div class="text-gray-400 dark:text-gray-500">|</div>

      <a
        href=""
        class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300"
      >
        Toutes les réservations
      </a>
    </div>

    <div id="table" class="">
      <div
        class="flex items-center gap-3 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-5 py-4 shadow-sm w-fit my-6"
      >
        <div
          class="flex items-center justify-center w-12 h-12 rounded-lg bg-blue-100 dark:bg-blue-900/40"
        >
          <svg
            class="w-6 h-6 text-[#10345B] dark:text-blue-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"
            />
          </svg>
        </div>

        <div>
          <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">Total reservations</p>
          <p class="text-2xl font-bold text-[#10345B] dark:text-white">
            {{ reservationsData().length }}
          </p>
        </div>
      </div>
      <table-component
        title="Consultez et gérez les réservations de salles."
        [headers]="reservationHeaders"
        [datas]="reservationsData()"
      ></table-component>
    </div>
  </main>
</div>
