<div class="bg-white p-6 rounded-xl border border-gray-300 shadow-sm">

    <h2 class="text-2xl font-bold text-[#10345B] mb-6">
      {{ title() }}
    </h2>
  
    <div class="grid grid-cols-2 gap-4">
  
      @for (field of fields(); track field.label) {
        <div
          class="flex flex-col gap-2"
          [class.col-span-2]="field.colSpan === 2"
        >
  
          <label class="font-bold text-gray-700">
            {{ field.label }}
          </label>
  
          <input
            [type]="field.type"
            [placeholder]="field.placeholder || ''"
            class="border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-300 focus:border-blue-500 outline-none"
          />
  
        </div>
      }
  
    </div>
  </div>
