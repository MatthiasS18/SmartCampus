<div
  class="relative overflow-x-auto bg-white shadow-sm border border-gray-300 rounded-xl my-10 ml-10 p-4"
>
  <h1 class="font-extrabold text-[#10345B] my-2">
    {{ title() }}
  </h1>

  <table class="w-full text-sm text-left text-gray-600">
    <thead class="text-[#10345B] text-sm bg-[#EAF2FB] border-b border-gray-300">
      <tr>
        @for (header of headers(); track header) {
          <th scope="col" class="px-6 py-3 font-semibold whitespace-nowrap">
            {{ header }}
          </th>
        }
      </tr>
    </thead>

    <tbody>
      @for (item of [1, 2, 3]; track item) {
        <tr class="border-b border-gray-200 hover:bg-blue-50 transition-colors">
          @if (item === 1) {
            <th scope="row" class="px-6 py-4 font-medium text-[#10345B] whitespace-nowrap">A101</th>
            <td class="px-6 py-4">10:00 - 12:00</td>
            <td class="px-6 py-4">Aujourd'hui</td>
          } @else if (item === 2) {
            <th scope="row" class="px-6 py-4 font-medium text-[#10345B] whitespace-nowrap">A102</th>
            <td class="px-6 py-4">14:00 - 16:00</td>
            <td class="px-6 py-4">Demain</td>
          } @else {
            <th scope="row" class="px-6 py-4 font-medium text-[#10345B] whitespace-nowrap">B201</th>
            <td class="px-6 py-4">09:00 - 10:00</td>
            <td class="px-6 py-4">30/10/2026</td>
          }
        </tr>
      }
    </tbody>
  </table>

  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between p-4">
    <span class="text-sm text-gray-600">
      Affichage de <strong>1-3</strong> sur <strong>3</strong>
    </span>

    <nav aria-label="Pagination" class="flex items-center gap-1">
      <button type="button" class="px-3 h-9 border border-gray-300 rounded-l-lg hover:bg-blue-50">
        Précédent
      </button>

      <button
        type="button"
        aria-current="page"
        class="w-9 h-9 border border-gray-300 bg-[#10345B] text-white"
      >
        1
      </button>

      <button type="button" class="px-3 h-9 border border-gray-300 rounded-r-lg hover:bg-blue-50">
        Suivant
      </button>
    </nav>
  </div>
</div>
