<div
  class="relative overflow-x-auto bg-white dark:bg-gray-800 shadow-sm border border-gray-300 dark:border-gray-700 rounded-xl my-10 ml-10 p-4 transition-colors duration-200"
>
  <h1 class="font-extrabold text-[#10345B] dark:text-white my-2">
    {{ title() }}
  </h1>

  <table class="w-full text-sm text-left text-gray-600 dark:text-gray-300">
    <thead
      class="text-[#10345B] dark:text-white text-sm bg-[#EAF2FB] dark:bg-gray-700 border-b border-gray-300 dark:border-gray-600"
    >
      <tr>
        @for (header of headers(); track header) {
          <th scope="col" class="px-6 py-3 font-semibold whitespace-nowrap">
            {{ header }}
          </th>
        }
      </tr>
    </thead>

    <tbody>
      @for (room of datas(); track room.id) {
        <tr>
          @for (value of getRoomValues(room); track $index) {
            @if ($index !== 0) {
              <td class="px-6 py-4">{{ value }}</td>
            }
          }

          <td class="px-6 py-4">
            <button type="button">➜</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">Aucune salle trouvée.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
