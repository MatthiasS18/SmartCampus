<div class="w-full max-w-3xl my-6">
  <div class="flex gap-3 rounded-2xl border border-gray-200 bg-white p-2 shadow-sm">
    <!-- Recherche -->
    <div class="flex flex-1 items-center gap-3 px-3 min-w-0">
      <svg
        class="w-5 h-5 shrink-0 text-gray-400"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <circle cx="11" cy="11" r="7" stroke-width="2" />
        <path stroke-linecap="round" stroke-width="2" d="m20 20-4-4" />
      </svg>

      <input
        type="search"
        placeholder="Rechercher une salle..."
        class="w-full min-w-0 border-0 bg-transparent text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:ring-0"
      />
    </div>

    <!-- Séparateur -->
    <div class="hidden sm:block h-8 w-px bg-gray-200"></div>

    <!-- Catégories à droite -->
    <div class="relative shrink-0">
      <button
        type="button"
        (click)="isDropdownOpen = !isDropdownOpen"
        class="flex items-center gap-2 rounded-xl bg-[#10345B] px-4 py-3 text-sm font-medium text-white transition hover:bg-[#174875]"
      >
        <span>{{ selectedCategory }}</span>

        <svg
          class="h-4 w-4 transition-transform"
          [class.rotate-180]="isDropdownOpen"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6" />
        </svg>
      </button>

      @if (isDropdownOpen) {
        <div
          class="absolute right-0 top-full z-50 mt-2 w-48 overflow-hidden rounded-xl border border-gray-200 bg-white p-1 shadow-lg"
        >
          @for (category of categories; track category) {
            <button
              type="button"
              (click)="selectCategory(category)"
              class="flex w-full items-center justify-between rounded-lg px-3 py-2.5 text-left text-sm transition hover:bg-blue-50"
              [class.bg-blue-50]="selectedCategory === category"
              [class.font-semibold]="selectedCategory === category"
              [class.text-[#10345B]]="selectedCategory === category"
            >
              {{ category }}

              @if (selectedCategory === category) {
                <span class="text-[#10345B]">✓</span>
              }
            </button>
          }
        </div>
      }
    </div>
  </div>
</div>
