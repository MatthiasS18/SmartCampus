<div
  class="flex justify-around bg-white dark:bg-gray-800 max-w-sm p-4 border border-gray-200 dark:border-gray-700 rounded-xl shadow-xs hover:bg-gray-50 dark:hover:bg-gray-700 w-60 h-30 transition-colors duration-200"
>
  <div class="flex flex-col justify-between w-24">
    <div
      class="border border-gray-300 dark:border-gray-600 rounded-xl w-10 h-10 {{ color() }}"
    ></div>

    <div class="text-3xl font-extrabold text-gray-900 dark:text-white">
      {{ value() }}
    </div>
  </div>

  <div class="flex w-full font-extrabold text-gray-800 dark:text-gray-200">
    {{ title() }}
  </div>
</div>
